name: Generate Keystore Base64
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Create Keystore and Print Base64
        run: |
          keytool -genkeypair -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mrwind_key -storepass mrwind123456 -keypass mrwind123456 -dname "CN=MrWind, OU=Dev, O=MrWind, L=HCM, S=HCM, C=VN"
          echo "=== COPY CHUOI BASE64 BEN DUOI ==="
          base64 -w 0 release-key.jks
          echo ""
